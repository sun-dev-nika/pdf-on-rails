services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdf_on_rails_production}
      POSTGRES_USER: ${POSTGRES_USER:-pdf_on_rails}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdf_on_rails} -d ${POSTGRES_DB:-pdf_on_rails_production}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      POSTGRES_DB: ${POSTGRES_DB:-pdf_on_rails_production}
      POSTGRES_USER: ${POSTGRES_USER:-pdf_on_rails}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      SOLID_QUEUE_IN_PUMA: "true"
    volumes:
      - rails_storage:/rails/storage
    # No `ports:` published to the host on purpose - cloudflared reaches this
    # over the internal compose network at http://web:80, so nothing needs to
    # be exposed on the Windows host's network interface at all.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  postgres_data:
  rails_storage:
